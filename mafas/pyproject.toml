[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mafas"
version = "0.1.0"
description = "Multi-Agent Financial AI System — data and RAG foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "rag*", "agents*", "eval*"]

[tool.setuptools.package-data]
eval = ["gold/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
