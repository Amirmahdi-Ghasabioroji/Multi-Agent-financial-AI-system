# Standalone Qdrant for local MAFAS development (corpus ingest + smoke tests).
#
# Readiness: no healthcheck here — nothing in this stack depends on
# service_healthy, and a fixed-interval probe would poll /readyz forever with
# no consumer. Clients (corpus_builder, agents) should retry with exponential
# backoff on connect; Qdrant has no readiness webhooks.
#
# The full dashboard stack (repo-root docker-compose.yml) probes Qdrant via the
# backend /api/v1/health endpoint instead; that path is separate from this file.

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
    # Share corpus with the full dashboard stack when both compose files are used.
    name: mafas_qdrant_storage
