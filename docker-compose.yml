name: mafas-dashboard

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mafas}
      MYSQL_USER: ${MYSQL_USER:-mafas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_storage:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    mem_limit: 2g
    cpus: "2.0"
    logging: *default-logging
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: "1.0"
    logging: *default-logging
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-mafas}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-mafas}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-financial_docs}
      # host.docker.internal works on Docker Desktop; on Linux override OLLAMA_URL in .env with your host IP.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      CACHE_DIR: /app/mafas/data/cache
      FRED_API_KEY: ${FRED_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      EXECUTION_ACCOUNT_EQUITY: ${EXECUTION_ACCOUNT_EQUITY:-100000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JOB_MAX_WORKERS: ${JOB_MAX_WORKERS:-1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./mafas/data/cache:/app/mafas/data/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    mem_limit: 4g
    cpus: "2.0"
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: "1.0"
    logging: *default-logging
    restart: unless-stopped

volumes:
  mysql_storage:
    name: mafas_mysql_storage
  qdrant_storage:
    # Reuse the volume created by the original mafas/docker-compose.yml.
    name: mafas_qdrant_storage
